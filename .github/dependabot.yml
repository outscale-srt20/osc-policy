version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore(deps)"
      include: scope
    # Cooldown proxy: ignore patch updates for 3 days, minor for 7 days
    # to reduce supply-chain attack surface from compromised releases.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
        # re-enable after 3 days via manual PR review
      # OPA 1.16+ requires Go 1.25 — hold until we upgrade the toolchain
      - dependency-name: "github.com/open-policy-agent/opa"
        versions: [">=1.16"]
    groups:
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
      otel:
        patterns:
          - "go.opentelemetry.io/*"
      cobra-viper:
        patterns:
          - "github.com/spf13/cobra"
          - "github.com/spf13/viper"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    # Cooldown proxy: ignore patch updates for actions — only take minor/major
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
