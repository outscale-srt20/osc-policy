version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore(deps)"
      include: scope
    cooldown:
      default-days: 7
      semver-patch-days: 3
    ignore:
      # OPA 1.16+ requires Go 1.25 — hold until we upgrade the toolchain
      - dependency-name: "github.com/open-policy-agent/opa"
        versions: [">=1.16"]
    groups:
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
      otel:
        patterns:
          - "go.opentelemetry.io/*"
      cobra-viper:
        patterns:
          - "github.com/spf13/cobra"
          - "github.com/spf13/viper"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7
      semver-patch-days: 3
